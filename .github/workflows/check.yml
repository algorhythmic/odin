# Runs the same `make check` the local receipts record, on a clean runner, so
# a merge to main is verified off the operator's host. No secrets are used.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false

      # Odin refuses an executable that others can write, and the tests use
      # this interpreter as a stand-in Claude binary. The runner's tool cache
      # is group-writable, so drop shared write from the interpreter first.
      - name: Make the Python interpreter non-shared-writable
        run: |
          python_bin="$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          chmod go-w "$python_bin"
          ls -l "$python_bin"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure git for tests that create repositories
        run: |
          git config --global user.name "odin-ci"
          git config --global user.email "odin-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: make check
        run: make check PYTHON=python GO=go
