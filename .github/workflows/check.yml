# Runs the same `make check` the local receipts record, on a clean runner, so
# a merge to main is verified off the operator's host. No secrets are used.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure git for tests that create repositories
        run: |
          git config --global user.name "odin-ci"
          git config --global user.email "odin-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: make check
        run: make check PYTHON=python GO=go
