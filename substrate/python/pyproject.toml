# Python implementation of the I0 substrate contract (substrate/schemas).
# I0 is non-production and fixture-only (ODIN-ADR-008).
[project]
name = "odin-substrate"
version = "0.0.0"
description = "I0 event-substrate contract checks: envelope, namespaces, record schemas and fixture conformance (non-production, fixture-only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odin_substrate"]

[tool.pytest.ini_options]
# The rootdir is this directory; putting it on sys.path lets
# `python3 -m pytest substrate/python/tests` run from the repository root
# without an install.
pythonpath = ["."]
testpaths = ["tests"]
